<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자본금 맞춤 계산기</title>
<style>
  :root{ --navy:#163f78; --blue:#1567c8; --bg:#eef3f8; --card:#ffffff; --text:#202b39;
    --muted:#5b6b7a; --line:#dce5ee; --danger:#c0392b; --good:#21865b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;line-height:1.6}
  header{background:var(--navy);color:#fff;padding:22px 20px}
  header a{color:#cfe0f7;font-size:13px;text-decoration:none}
  header h1{margin:8px 0 0;font-size:22px}
  main{max-width:480px;margin:0 auto;padding:20px}
  .card{background:var(--card);border-radius:14px;padding:22px;margin-bottom:16px}
  label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
  label:first-child{margin-top:0}
  select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .error{color:var(--danger);font-size:13px;margin-top:6px;min-height:18px}
  button{width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;
    padding:16px;font-size:17px;font-weight:700;margin-top:18px;cursor:pointer}
  .result{margin-top:16px;padding:16px;border-radius:10px;font-size:15px}
  .result.ok{background:#eafaf1;color:var(--good);border:1px solid #bfe9d3}
  .result.bad{background:#fdecea;color:var(--danger);border:1px solid #f5c6c0}
  .source{font-size:12px;color:var(--muted);margin-top:14px}
  .notice{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<header>
  <a href="./index.html">← 랜딩으로</a>
  <h1>자본금 맞춤 계산기</h1>
</header>
<main>
  <div class="card">
    <label for="complex">관심 단지</label>
    <select id="complex"></select>
    <div id="dataError" class="error"></div>

    <label for="price">분양가 (원, 참고용 직접 입력)</label>
    <input type="text" inputmode="numeric" id="price" placeholder="예: 400000000">
    <div class="hint">공식 분양가 데이터가 없어 참고용으로 직접 입력합니다.</div>
    <div id="priceError" class="error"></div>

    <label for="capital">보유 자본금 (원)</label>
    <input type="text" inputmode="numeric" id="capital" placeholder="예: 100000000">

    <label for="rate">계약금 비율 (%)</label>
    <input type="text" inputmode="numeric" id="rate" value="20">

    <button id="calcBtn">계산하기</button>
    <div id="result"></div>
    <div id="sourceLine" class="source"></div>
    <div class="notice">이 페이지는 수업 과제 데모입니다. 분양가는 참고값이며 투자·대출 판단의 근거가 아닙니다.</div>
  </div>
</main>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
